<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pronova — YDS, YÖKDİL ve YDT için yeni nesil hazırlık</title>
  <meta name="description" content="YDS, YÖKDİL ve YDT için kategori bazlı denemeler, detaylı çözümler ve gerçek zamanlı ilerleme takibi. Yabancı dil sınavlarında zirveye taşıyan yol arkadaşın." />
  <meta name="theme-color" content="#F97316" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- İstenilen font ailesi: Plus Jakarta Sans ve diğerleri -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       Pronova — Showcase
       Brand: warm orange (#F97316) on cream/white,
       editorial typography, refined spacing, subtle motion.
       ============================================================ */

    :root {
      /* Brand */
      --primary: #F97316;
      --primary-dark: #EA580C;
      --primary-light: #FB923C;
      --accent-light: #FFF7ED;
      --accent-soft: #FEF3E8;

      /* Surfaces */
      --bg: #FAF7F2;          /* warm cream */
      --bg-2: #F2F2F7;        /* iOS gray */
      --surface: #FFFFFF;
      --surface-soft: #FBF8F3;
      --ink: #1C1C1E;
      --ink-2: #2A2A2E;
      --muted: #6B6B70;
      --muted-2: #8E8E93;
      --hairline: #E8E4DC;

      /* Status / accents */
      --success: #34C759;
      --success-soft: #ECFDF3;
      --blue: #3B82F6;
      --blue-soft: #EEF4FF;
      --pink: #EC4899;
      --pink-soft: #FDF2F8;
      --purple: #8B5CF6;

      /* Type */
      --font-display: 'Fraunces', 'Times New Roman', serif;
      --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      /* Layout */
      --max: 1200px;
      --radius-sm: 12px;
      --radius: 20px;
      --radius-lg: 32px;
      --radius-xl: 44px;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      margin: 0;
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg);
      font-size: 16px;
      line-height: 1.55;
      overflow-x: hidden;
    }

    /* Subtle paper grain overlay */
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.55  0 0 0 0 0.5  0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; border: none; background: none; }

    .container {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 2;
    }

    /* ========================  Typography  ======================== */
    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 500;
      letter-spacing: -0.025em;
      line-height: 1.05;
      margin: 0;
      color: var(--ink);
      font-variation-settings: "opsz" 144, "SOFT" 50;
    }
    .display-1 {
      font-size: clamp(44px, 7.2vw, 96px);
      font-weight: 400;
    }
    .display-2 {
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 400;
    }
    .display-3 {
      font-size: clamp(28px, 3.4vw, 44px);
      font-weight: 500;
    }
    .italic { font-style: italic; font-weight: 400; }
    .ink-orange { color: var(--primary); }

    .eyebrow {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .eyebrow::before {
      content: "";
      width: 24px; height: 1px;
      background: currentColor;
    }
    .eyebrow.no-line::before { display: none; }

    .lead {
      font-size: clamp(17px, 1.4vw, 20px);
      color: var(--muted);
      line-height: 1.55;
      max-width: 60ch;
    }

    /* ========================  Buttons  ======================== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.25s ease;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .btn-primary {
      background: var(--ink);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -10px rgba(249,115,22,0.55);
    }
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border-color: var(--hairline);
    }
    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--ink);
    }
    .btn-arrow {
      transition: transform 0.25s ease;
    }
    .btn:hover .btn-arrow { transform: translateX(4px); }

    /* ========================  Nav  ======================== */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      background: rgba(250, 247, 242, 0.78);
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s ease, background 0.3s ease;
    }
    .nav.scrolled {
      border-bottom-color: var(--hairline);
      background: rgba(250, 247, 242, 0.92);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .logo-mark {
      width: 30px; height: 30px;
      border-radius: 9px;
      background: var(--primary);
      display: grid; place-items: center;
      color: #fff;
      box-shadow: inset 0 -6px 12px rgba(0,0,0,0.08);
    }
    .logo-mark svg { width: 16px; height: 16px; }
    .nav-links {
      display: flex; gap: 36px;
      font-size: 14px; font-weight: 500;
      color: var(--ink-2);
    }
    .nav-links a { transition: color 0.2s; }
    .nav-links a:hover { color: var(--primary); }
    .nav-cta { display: flex; gap: 10px; }
    .nav-cta .btn { padding: 10px 18px; font-size: 14px; }

    @media (max-width: 820px) {
      .nav-links { display: none; }
    }

    /* ========================  Hero  ======================== */
    .hero {
      padding: 96px 0 72px;
      position: relative;
      overflow: hidden;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 64px;
      align-items: center;
    }
    .hero-copy h1 {
      margin-top: 28px;
    }
    .hero-copy .lead {
      margin-top: 28px;
    }
    .hero-actions {
      margin-top: 40px;
      display: flex; flex-wrap: wrap;
      gap: 12px;
    }
    .hero-meta {
      margin-top: 36px;
      display: flex; align-items: center; gap: 16px;
      font-size: 13px; color: var(--muted);
    }
    .dots {
      display: inline-flex; gap: 4px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); opacity: 0.85; }
    .dot:nth-child(2) { opacity: 0.55; }
    .dot:nth-child(3) { opacity: 0.3; }

    /* Phone mockup */
    .phone-stage {
      position: relative;
      display: grid; place-items: center;
      min-height: 640px;
    }
    .phone-stage::before {
      content: "";
      position: absolute;
      inset: 10% -10% 10% -10%;
      background: radial-gradient(60% 50% at 50% 50%, rgba(249,115,22,0.18), transparent 70%);
      filter: blur(20px);
      z-index: 0;
    }
    .phone {
      position: relative;
      width: 320px;
      border-radius: 44px;
      padding: 10px;
      background: linear-gradient(160deg, #1c1c1e, #3a3a3c);
      box-shadow:
        0 60px 120px -40px rgba(28,28,30,0.4),
        0 30px 60px -30px rgba(249,115,22,0.25),
        inset 0 0 0 1px rgba(255,255,255,0.05);
      z-index: 1;
      transform: rotate(-2deg);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .phone:hover { transform: rotate(0deg) translateY(-6px); }
    .phone-screen {
      border-radius: 36px;
      overflow: hidden;
      background: var(--surface);
      aspect-ratio: 9 / 19.5;
    }
    .phone-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
    }

    /* Floating accent card behind phone */
    .float-card {
      position: absolute;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: 0 24px 48px -20px rgba(28,28,30,0.18);
      z-index: 2;
      display: flex; align-items: center; gap: 14px;
      animation: floaty 6s ease-in-out infinite;
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .float-card.fc-1 {
      top: 10%; left: -8%;
      animation-delay: 0s;
    }
    .float-card.fc-2 {
      bottom: 14%; right: -6%;
      animation-delay: 1.5s;
    }
    .fc-icon {
      width: 42px; height: 42px;
      border-radius: 12px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .fc-icon.orange { background: var(--accent-soft); color: var(--primary); }
    .fc-icon.green { background: var(--success-soft); color: var(--success); }
    .fc-icon svg { width: 20px; height: 20px; }
    .fc-text small {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-2);
      font-weight: 600;
    }
    .fc-text strong {
      display: block;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 18px;
      margin-top: 2px;
    }

    @media (max-width: 880px) {
      .hero { padding: 64px 0 48px; }
      .hero-grid {
        grid-template-columns: 1fr;
        gap: 48px;
      }
      .phone-stage { min-height: 560px; }
      .phone { width: 280px; }
      .float-card.fc-1 { left: -4%; }
      .float-card.fc-2 { right: -4%; }
    }

    /* ========================  Marquee strip  ======================== */
    .strip {
      background: var(--ink);
      color: #fff;
      padding: 22px 0;
      overflow: hidden;
      position: relative;
      z-index: 2;
    }
    .strip-track {
      display: flex;
      gap: 56px;
      width: max-content;
      animation: marquee 38s linear infinite;
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .strip-track span { display: inline-flex; align-items: center; gap: 56px; }
    .strip-track .sep {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--primary);
      display: inline-block;
    }
    .strip-track em { color: var(--primary); font-style: italic; }
    @keyframes marquee {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* ========================  Stats  ======================== */
    .stats {
      padding: 80px 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }
    .stat {
      padding: 32px 24px;
      border-right: 1px solid var(--hairline);
    }
    .stat:last-child { border-right: none; }
    .stat-value {
      font-family: var(--font-display);
      font-size: clamp(40px, 5vw, 64px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.03em;
    }
    .stat-value sup { font-size: 0.5em; color: var(--primary); top: -0.7em; margin-left: 4px; }
    .stat-label {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    @media (max-width: 720px) {
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .stat:nth-child(2) { border-right: none; }
      .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--hairline); }
    }

    /* ========================  Section heads  ======================== */
    .section {
      padding: 96px 0;
      position: relative;
      z-index: 2;
    }
    .section-head {
      max-width: 760px;
      margin-bottom: 64px;
    }
    .section-head h2 {
      margin-top: 24px;
    }
    .section-head .lead {
      margin-top: 24px;
    }

    /* ========================  Categories  ======================== */
    .cats {
      background: var(--surface);
      border-top: 1px solid var(--hairline);
      border-bottom: 1px solid var(--hairline);
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .cat {
      position: relative;
      background: var(--surface-soft);
      border: 1px solid var(--hairline);
      border-radius: var(--radius-lg);
      padding: 36px 32px 32px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .cat:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px -30px rgba(28,28,30,0.18);
    }
    .cat-tag {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .cat-tag.orange { background: var(--accent-soft); color: var(--primary-dark); }
    .cat-tag.blue { background: var(--blue-soft); color: var(--blue); }
    .cat-tag.pink { background: var(--pink-soft); color: var(--pink); }

    .cat h3 {
      margin-top: 22px;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.025em;
    }
    .cat p {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }
    .cat-stats {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px dashed var(--hairline);
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .cat-stats div { font-size: 13px; }
    .cat-stats strong {
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 22px;
      display: block;
      letter-spacing: -0.02em;
    }
    .cat-stats span { color: var(--muted-2); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }

    .cat-art {
      position: absolute;
      bottom: -30px; right: -30px;
      width: 140px; height: 140px;
      border-radius: 50%;
      opacity: 0.06;
    }
    .cat:nth-child(1) .cat-art { background: var(--primary); }
    .cat:nth-child(2) .cat-art { background: var(--blue); }
    .cat:nth-child(3) .cat-art { background: var(--pink); }

    @media (max-width: 880px) {
      .cat-grid { grid-template-columns: 1fr; }
    }

    /* ========================  Feature rows  ======================== */
    .feature {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
      padding: 64px 0;
      border-top: 1px solid var(--hairline);
    }
    .feature.reverse .feature-visual { order: 2; }
    .feature.reverse .feature-text { order: 1; }
    .feature-text .feature-num {
      font-family: var(--font-display);
      font-size: 64px;
      font-weight: 300;
      color: var(--primary);
      line-height: 1;
      font-feature-settings: "tnum";
    }
    .feature-text h3 {
      margin-top: 12px;
      font-size: clamp(30px, 3.4vw, 44px);
      font-weight: 500;
    }
    .feature-text p {
      margin-top: 20px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
      max-width: 48ch;
    }
    .feature-list {
      list-style: none;
      padding: 0;
      margin: 28px 0 0;
      display: grid;
      gap: 12px;
    }
    .feature-list li {
      display: flex; align-items: flex-start; gap: 12px;
      font-size: 15px;
      color: var(--ink-2);
    }
    .feature-list .check {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--success-soft);
      color: var(--success);
      display: grid; place-items: center;
      margin-top: 2px;
    }
    .feature-list .check svg { width: 12px; height: 12px; }

    .feature-visual {
      position: relative;
      display: grid; place-items: center;
      min-height: 580px;
    }
    .feature-visual::before {
      content: "";
      position: absolute;
      inset: 8% 5% 8% 5%;
      border-radius: 40px;
      background: linear-gradient(135deg, var(--accent-light), transparent 70%);
      z-index: 0;
    }
    .feature-visual.tinted-blue::before {
      background: linear-gradient(135deg, var(--blue-soft), transparent 70%);
    }
    .feature-visual.tinted-pink::before {
      background: linear-gradient(135deg, var(--pink-soft), transparent 70%);
    }

    .phone-sm {
      position: relative;
      z-index: 1;
      width: 280px;
      border-radius: 40px;
      padding: 9px;
      background: linear-gradient(160deg, #1c1c1e, #3a3a3c);
      box-shadow:
        0 50px 100px -40px rgba(28,28,30,0.4),
        inset 0 0 0 1px rgba(255,255,255,0.05);
    }
    .phone-sm .phone-screen {
      border-radius: 32px;
      aspect-ratio: 9 / 19.5;
    }

    /* Annotation badge */
    .anno {
      position: absolute;
      z-index: 3;
      background: var(--surface);
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink);
      box-shadow: 0 18px 40px -16px rgba(28,28,30,0.2);
      display: inline-flex; align-items: center; gap: 10px;
    }
    .anno-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 4px rgba(249,115,22,0.18);
    }
    .anno-dot.green { background: var(--success); box-shadow: 0 0 0 4px rgba(52,199,89,0.18); }
    .anno-dot.blue { background: var(--blue); box-shadow: 0 0 0 4px rgba(59,130,246,0.18); }

    .feature-visual .anno-1 { top: 18%; left: 0; }
    .feature-visual .anno-2 { bottom: 22%; right: 2%; }

    @media (max-width: 880px) {
      .feature {
        grid-template-columns: 1fr;
        gap: 48px;
        padding: 48px 0;
      }
      .feature.reverse .feature-visual { order: -1; }
      .feature.reverse .feature-text { order: 2; }
      .feature-visual { min-height: 520px; }
      .phone-sm { width: 240px; }
    }

    /* ========================  Question types  ======================== */
    .qtypes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .qtype {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--radius);
      padding: 24px;
      transition: all 0.25s ease;
      position: relative;
    }
    .qtype:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 18px 40px -20px rgba(249,115,22,0.25);
    }
    .qtype-num {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted-2);
      letter-spacing: 0.1em;
    }
    .qtype h4 {
      margin-top: 8px;
      font-family: var(--font-display);
      font-weight: 500;
      font-size: 22px;
    }
    .qtype p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }
    .qtype-meta {
      margin-top: 18px;
      display: flex; align-items: center; gap: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
    }
    @media (max-width: 880px) {
      .qtypes-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 560px) {
      .qtypes-grid { grid-template-columns: 1fr; }
    }

    /* ========================  Showcase strip  ======================== */
    .showcase {
      background: var(--ink);
      color: #fff;
      padding: 120px 0;
      position: relative;
      overflow: hidden;
    }
    .showcase .eyebrow { color: var(--primary-light); }
    .showcase h2 { color: #fff; max-width: 800px; }
    .showcase .lead { color: rgba(255,255,255,0.65); }
    .showcase-row {
      margin-top: 64px;
      display: flex;
      gap: 24px;
      overflow-x: auto;
      padding: 20px 4px 40px;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .showcase-row::-webkit-scrollbar { display: none; }
    .showcase-card {
      flex: 0 0 260px;
      scroll-snap-align: start;
